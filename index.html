<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Infinite Board Pro</title>
<style>
:root, [data-theme="dark"] {
  --bg:#121212; --surface:#1e1e1e; --border:#333; --accent:#d4af37; --text:#e0e0e0;
  --dot:rgba(255,255,255,.16); --danger:#e57373; --panel:rgba(30,30,30,.9); --highlight:#ffe066;
  --sel-box:rgba(212,175,55,0.15); --sel-border:rgba(212,175,55,0.8);
}
[data-theme="light"] {
  --bg:#eef0f3; --surface:#ffffff; --border:#d7d9dd; --accent:#b8860b; --text:#1c1c1c;
  --dot:rgba(0,0,0,.16); --danger:#d32f2f; --panel:rgba(255,255,255,.92); --highlight:#fff3bf;
  --sel-box:rgba(184,134,11,0.15); --sel-border:rgba(184,134,11,0.8);
}
* { box-sizing:border-box; }
body { margin:0; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,sans-serif; touch-action:none; user-select:none; transition:background .2s; }

#bg-layer { position:fixed; inset:0; z-index:0; pointer-events:none; }
#viewport { width:100vw; height:100vh; position:relative; overflow:hidden; cursor:default; z-index:1; }
#viewport[data-mode="pan"] { cursor:grab; }
#viewport.panning { cursor:grabbing; }
#viewport[data-mode="draw"] { cursor:crosshair; }

#canvas { position:absolute; top:0; left:0; width:0; height:0; transform-origin:0 0; will-change:transform; }
#drawSvg, #connSvg { position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }
.conn { stroke:var(--accent); stroke-width:2; fill:none; }
.temp-line { stroke:var(--accent); stroke-width:2; stroke-dasharray:5,4; }
.freehand { fill:none; stroke-linecap:round; stroke-linejoin:round; }

#marquee { position:absolute; border:1px solid var(--sel-border); background:var(--sel-box); z-index:900; display:none; pointer-events:none; }

/* Toolbars */
#tools-bar { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:1000;
  display:flex; gap:4px; background:var(--panel); backdrop-filter:blur(12px);
  padding:6px; border-radius:12px; border:1px solid var(--border); box-shadow:0 8px 32px rgba(0,0,0,.4); }

#ui-bar { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:1000;
  display:flex; gap:8px; background:var(--panel); backdrop-filter:blur(12px);
  padding:10px 12px; border-radius:14px; border:1px solid var(--border); box-shadow:0 8px 32px rgba(0,0,0,.4);
  max-width:94vw; overflow-x:auto; }
#ui-bar::-webkit-scrollbar{ display:none; }

button, .ui-btn { padding:8px 12px; cursor:pointer; border:1px solid var(--border);
  background:var(--surface); color:var(--text); border-radius:8px; font-weight:500;
  transition:all .15s ease; font-size:13px; white-space:nowrap; flex-shrink:0; }
button:hover, .ui-btn:hover { border-color:var(--accent); color:var(--accent); }
button.active-tool { background:var(--accent); color:#000; border-color:var(--accent); }
button:active { transform:scale(.95); }
.icon-btn { width:36px; padding:8px; text-align:center; }

#zoom-group { display:flex; align-items:center; gap:2px; margin-left:8px; padding-left:8px; border-left:1px solid var(--border); }
#zoom-label { font-size:12px; opacity:.7; width:42px; text-align:center; flex-shrink:0; }

.menu { position:fixed; bottom:70px; background:var(--panel); backdrop-filter:blur(12px);
  border:1px solid var(--border); border-radius:10px; padding:6px; display:none; flex-direction:column;
  gap:4px; z-index:1001; box-shadow:0 8px 24px rgba(0,0,0,.4); }
.menu.open { display:flex; }

#settings-panel { position:fixed; top:16px; right:16px; z-index:1001; background:var(--panel);
  backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:12px; padding:16px;
  width:230px; display:none; flex-direction:column; gap:14px; box-shadow:0 8px 32px rgba(0,0,0,.4); font-size:13px; }
#settings-panel.open { display:flex; }
#settings-panel h4 { margin:0 0 4px 0; font-size:12px; opacity:.6; text-transform:uppercase; letter-spacing:.05em; }
.opt-row { display:flex; gap:6px; }
.opt-row button { flex:1; padding:6px; font-size:12px; }
.opt-row button.active { border-color:var(--accent); color:var(--accent); background:rgba(212,175,55,.1); }
.switch-row { display:flex; align-items:center; justify-content:space-between; }

/* Nodes */
.node { position:absolute; top:0; left:0; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.35); display:flex; flex-direction:column; }
.node.selected { outline:2px solid var(--accent); outline-offset:2px; }
.node.highlighted { box-shadow:0 0 0 3px var(--highlight), 0 4px 16px rgba(0,0,0,.35); }
.node-header { height:20px; background:rgba(128,128,128,.08); border-bottom:1px solid var(--border);
  border-radius:8px 8px 0 0; cursor:grab; flex-shrink:0; }
.node-header:active { cursor:grabbing; }
.node-body { flex:1; padding:10px; position:relative; overflow:auto; display:flex; flex-direction:column; }

/* Comments */
.node.comment-collapsed { width:32px !important; height:32px !important; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--accent); color:#000; overflow:hidden; }
.node.comment-collapsed .node-header, .node.comment-collapsed .resize-handle { display:none; }
.node.comment-collapsed .node-body { display:none; }

.node textarea { width:100%; height:100%; background:transparent; border:none; color:var(--text);
  resize:none; outline:none; font-family:inherit; font-size:14px; line-height:1.4; cursor:text; }
.node textarea[readonly] { cursor:default; user-select:none; }

.node .label { width:100%; height:100%; outline:none; display:flex; align-items:center; justify-content:center; text-align:center; font-size:14px; overflow:auto; word-break:break-word; }
.node img { width:100%; height:100%; display:block; pointer-events:none; }

/* Lists & Tables */
.checklist-item { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.checklist-item input[type="checkbox"] { cursor:pointer; accent-color:var(--accent); }
.checklist-item span { flex:1; outline:none; font-size:14px; }
.checklist-item span[contenteditable="true"] { border-bottom:1px solid var(--accent); }
.add-chk-btn { background:none; border:none; color:var(--accent); text-align:left; padding:4px 0; font-size:12px; cursor:pointer; margin-top:auto;}
.node table { width:100%; height:100%; border-collapse:collapse; table-layout:fixed; }
.node td { border:1px solid var(--border); padding:4px; outline:none; text-align:center; font-size:13px; overflow:hidden; }

/* UI Handles */
.node-tools { position:absolute; top:-14px; right:2px; display:none; gap:4px; z-index:5; }
.node:hover .node-tools, .node.selected .node-tools { display:flex; }
.node-tools span { width:20px; height:20px; border-radius:50%; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; }
.handle { position:absolute; width:11px; height:11px; border-radius:50%; background:var(--accent); border:2px solid var(--surface); display:none; z-index:6; }
.node:hover .handle, .node.selected .handle { display:block; }
.handle.n { top:-6px; left:calc(50% - 5px); cursor:crosshair; }
.handle.s { bottom:-6px; left:calc(50% - 5px); cursor:crosshair; }
.handle.e { right:-6px; top:calc(50% - 5px); cursor:crosshair; }
.handle.w { left:-6px; top:calc(50% - 5px); cursor:crosshair; }
.resize-handle { position:absolute; width:12px; height:12px; right:-4px; bottom:-4px; cursor:nwse-resize; background:var(--surface); border:2px solid var(--accent); border-radius:3px; display:none; z-index:6; }
.node:hover .resize-handle, .node.selected .resize-handle { display:block; }

.color-row { position:absolute; top:-34px; left:0; display:none; gap:4px; background:var(--panel); padding:5px; border-radius:8px; border:1px solid var(--border); z-index:7; }
.color-row.open { display:flex; }
.swatch { width:16px; height:16px; border-radius:50%; cursor:pointer; border:1px solid rgba(0,0,0,.2); }
#file-input { display:none; }
</style>
</head>
<body>
<div id="bg-layer"></div>

<div id="settings-panel">
  <div><h4>Theme</h4><div class="opt-row" id="theme-row"><button data-v="dark">Dark</button><button data-v="light">Light</button></div></div>
  <div><h4>Background</h4><div class="opt-row" id="bg-row"><button data-v="none">None</button><button data-v="dots">Dots</button><button data-v="grid">Grid</button></div></div>
  <div><h4>Connectors</h4><div class="opt-row" id="line-row"><button data-v="straight">Straight</button><button data-v="curved">Curved</button></div></div>
  <div class="switch-row"><span>Snap to grid</span><input type="checkbox" id="snap-toggle"></div>
  <button id="clear-btn" style="color:var(--danger); border-color:var(--danger);">Clear board</button>
</div>

<div class="menu" id="shape-menu">
  <button data-shape="rect">Rectangle</button>
  <button data-shape="circle">Circle</button>
  <button data-shape="diamond">Diamond</button>
</div>

<div id="tools-bar">
  <button class="icon-btn active-tool" id="tool-select" title="Select (V)">↖</button>
  <button class="icon-btn" id="tool-pan" title="Pan (Space)">✋</button>
  <button class="icon-btn" id="tool-draw" title="Draw (P)">✏️</button>
</div>

<div id="viewport" data-mode="select">
  <div id="canvas">
    <div id="marquee"></div>
    <svg id="drawSvg"></svg>
    <svg id="connSvg"><defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="var(--accent)"></path>
      </marker>
    </defs></svg>
  </div>
</div>

<input type="file" id="file-input" accept="image/*">

<div id="ui-bar">
  <button id="auth-btn">Drive Sync</button>
  <button id="save-btn" style="display:none;">Sync</button>
  <button class="icon-btn" id="note-btn" title="Note (N)">N</button>
  <button class="icon-btn" id="shape-btn" title="Shape">◇</button>
  <button class="icon-btn" id="chk-btn" title="Checklist (T)">☑</button>
  <button class="icon-btn" id="tbl-btn" title="Table (Y)">▦</button>
  <button class="icon-btn" id="image-btn" title="Image (I)">🖼</button>
  <button class="icon-btn" id="comment-btn" title="Comment (C)">💬</button>
  <button class="icon-btn" id="settings-btn" title="Settings">⚙️</button>
  
  <div id="zoom-group">
    <button class="icon-btn" id="zoom-out" title="Zoom Out">−</button>
    <span id="zoom-label">100%</span>
    <button class="icon-btn" id="zoom-in" title="Zoom In">+</button>
    <button class="icon-btn" id="zoom-fit-btn" title="Zoom to Fit (Shift+1)">[ ]</button>
    <button class="icon-btn" id="zoom-sel-btn" title="Zoom to Selected (Shift+2)">[•]</button>
  </div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoad()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoad()"></script>

<script>
// ===================== STATE =====================
const CLIENT_ID = '500297009261-i1aa5fekjptp3i1kgpst248knc18gvt6.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.file';
const FILE_NAME = 'my_personal_board.json';
let tokenClient, fileId = null;

let nodes = [], connections = [], drawings = [];
let theme = 'dark', bgStyle = 'dots', lineStyle = 'straight', snapEnabled = false;
let panX = window.innerWidth/2 - 500, panY = window.innerHeight/2 - 300, zoom = 1;
let selectedIds = new Set(); 
let idSeed = 1;
const uid = () => 'n' + (Date.now().toString(36)) + (idSeed++);

// Modes: select, pan, draw
let toolMode = 'select';
function setTool(mode) {
  toolMode = mode;
  viewport.setAttribute('data-mode', mode);
  document.querySelectorAll('#tools-bar button').forEach(b => b.classList.remove('active-tool'));
  document.getElementById('tool-'+mode).classList.add('active-tool');
}
document.getElementById('tool-select').onclick = () => setTool('select');
document.getElementById('tool-pan').onclick = () => setTool('pan');
document.getElementById('tool-draw').onclick = () => setTool('draw');

const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const connSvg = document.getElementById('connSvg');
const drawSvg = document.getElementById('drawSvg');
const bgLayer = document.getElementById('bg-layer');
const marqueeEl = document.getElementById('marquee');

let dragState = null, resizeState = null, connecting = null;
let currentPath = null, currentPathEl = null;
let marqueeState = null, isPanning = false, panStartX, panStartY;
let pendingImagePos = null;
const keysDown = {};
const isTyping = () => { const a = document.activeElement; return !!(a && (a.tagName === 'TEXTAREA' || a.isContentEditable || a.tagName === 'INPUT')); };

// ===================== TRANSFORM & RENDER =====================
function applyTheme() {
  document.body.setAttribute('data-theme', theme);
  document.querySelectorAll('#theme-row button').forEach(b => b.classList.toggle('active', b.dataset.v === theme));
  updateBackground();
}
function updateBackground() {
  document.querySelectorAll('#bg-row button').forEach(b => b.classList.toggle('active', b.dataset.v === bgStyle));
  document.querySelectorAll('#line-row button').forEach(b => b.classList.toggle('active', b.dataset.v === lineStyle));
  const size = 26 * zoom, px = ((panX % size) + size) % size, py = ((panY % size) + size) % size;
  if (bgStyle === 'none') { bgLayer.style.backgroundImage = 'none'; return; }
  bgLayer.style.backgroundImage = bgStyle === 'dots' 
    ? `radial-gradient(circle, var(--dot) 1.5px, transparent 1.6px)` 
    : `linear-gradient(var(--dot) 1px, transparent 1px), linear-gradient(90deg, var(--dot) 1px, transparent 1px)`;
  bgLayer.style.backgroundSize = `${size}px ${size}px`;
  bgLayer.style.backgroundPosition = `${px}px ${py}px`;
}
function applyCanvasTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
  updateBackground();
}
function screenToWorld(cx, cy) {
  const r = viewport.getBoundingClientRect();
  return { x: (cx - r.left - panX) / zoom, y: (cy - r.top - panY) / zoom };
}
function centerWorld() { return screenToWorld(window.innerWidth / 2, window.innerHeight / 2); }

function renderDrawings() {
  drawSvg.innerHTML = '';
  drawings.forEach(d => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M ${d.points.map(pt => `${pt.x},${pt.y}`).join(' L ')}`);
    p.setAttribute('stroke', d.color || 'var(--accent)');
    p.setAttribute('stroke-width', d.width || 3);
    p.setAttribute('class', 'freehand');
    drawSvg.appendChild(p);
  });
}

// ===================== INPUT LOGIC =====================
viewport.addEventListener('pointerdown', (e) => {
  const isCanvasHit = e.target === viewport || e.target === canvas || e.target === connSvg || e.target === drawSvg;
  
  if (isCanvasHit) {
    const wp = screenToWorld(e.clientX, e.clientY);
    deselectAll();
    
    // Quick adds
    if (keysDown['n']) return createNote(wp);
    if (keysDown['c']) return createComment(wp);
    if (keysDown['t']) return createChecklist(wp);
    if (keysDown['y']) return createTable(wp);
    
    // Pan Mode (forced by Tool or Spacebar)
    if (toolMode === 'pan' || keysDown[' ']) {
      isPanning = true;
      panStartX = e.clientX - panX; panStartY = e.clientY - panY;
      viewport.classList.add('panning');
      return;
    }

    // Draw Mode
    if (toolMode === 'draw') {
      currentPath = { id: uid(), points: [wp], color: 'var(--accent)', width: 3 };
      currentPathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      currentPathEl.setAttribute('stroke', currentPath.color);
      currentPathEl.setAttribute('stroke-width', currentPath.width);
      currentPathEl.setAttribute('class', 'freehand');
      drawSvg.appendChild(currentPathEl);
      return;
    }

    // Select Mode -> Marquee Box
    marqueeState = { startX: wp.x, startY: wp.y };
    marqueeEl.style.display = 'block';
    marqueeEl.style.left = wp.x + 'px'; marqueeEl.style.top = wp.y + 'px';
    marqueeEl.style.width = '0px'; marqueeEl.style.height = '0px';
  }
});

window.addEventListener('pointermove', (e) => {
  const wp = screenToWorld(e.clientX, e.clientY);
  
  if (isPanning) { 
    panX = e.clientX - panStartX; panY = e.clientY - panStartY; 
    applyCanvasTransform(); 
    return; 
  }
  
  if (marqueeState) {
    const x = Math.min(wp.x, marqueeState.startX), y = Math.min(wp.y, marqueeState.startY);
    const w = Math.abs(wp.x - marqueeState.startX), h = Math.abs(wp.y - marqueeState.startY);
    marqueeEl.style.left = x + 'px'; marqueeEl.style.top = y + 'px';
    marqueeEl.style.width = w + 'px'; marqueeEl.style.height = h + 'px';
    
    // Live selection evaluation
    nodes.forEach(n => {
      const intersect = !(n.x > x+w || n.x+n.w < x || n.y > y+h || n.y+n.h < y);
      if(intersect) selectedIds.add(n.id); else selectedIds.delete(n.id);
    });
    updateSelectionUI();
    return;
  }

  if (currentPath) {
    currentPath.points.push(wp);
    currentPathEl.setAttribute('d', `M ${currentPath.points.map(pt => `${pt.x},${pt.y}`).join(' L ')}`);
    return;
  }

  if (dragState) {
    dragState.items.forEach(d => {
      let nx = wp.x - d.offX, ny = wp.y - d.offY;
      if (snapEnabled) { nx = Math.round(nx / 20) * 20; ny = Math.round(ny / 20) * 20; }
      d.node.x = nx; d.node.y = ny;
      d.el.style.transform = `translate(${nx}px, ${ny}px)`;
    });
    drawConnections();
  }
  if (resizeState) {
    resizeState.node.w = Math.max(40, resizeState.startW + (wp.x - resizeState.startWorld.x));
    resizeState.node.h = Math.max(32, resizeState.startH + (wp.y - resizeState.startWorld.y));
    resizeState.el.style.width = resizeState.node.w + 'px';
    resizeState.el.style.height = resizeState.node.h + 'px';
    drawConnections();
  }
  if (connecting) {
    connecting.line.setAttribute('x2', wp.x); connecting.line.setAttribute('y2', wp.y);
  }
});

window.addEventListener('pointerup', (e) => {
  isPanning = false; viewport.classList.remove('panning');
  dragState = null; resizeState = null;
  
  if (marqueeState) { marqueeEl.style.display = 'none'; marqueeState = null; }
  
  if (currentPath) {
    if(currentPath.points.length > 2) drawings.push(currentPath);
    else currentPathEl.remove();
    currentPath = null; currentPathEl = null;
  }

  if (connecting) {
    connecting.line.remove();
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const targetNode = target && target.closest('.node');
    if (targetNode && targetNode.dataset.id !== connecting.fromId) {
      connections.push({ id: uid(), from: connecting.fromId, to: targetNode.dataset.id });
      drawConnections();
    }
    connecting = null;
  }
});

// ===================== ZOOMING =====================
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const before = screenToWorld(e.clientX, e.clientY);
  zoom = Math.min(5, Math.max(0.1, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
  const r = viewport.getBoundingClientRect();
  panX = e.clientX - r.left - before.x * zoom; panY = e.clientY - r.top - before.y * zoom;
  applyCanvasTransform();
}, { passive: false });
document.getElementById('zoom-in').onclick = () => { zoom = Math.min(5, zoom * 1.2); applyCanvasTransform(); };
document.getElementById('zoom-out').onclick = () => { zoom = Math.max(0.1, zoom / 1.2); applyCanvasTransform(); };

function zoomToBBox(minX, minY, maxX, maxY) {
  if (minX > maxX) return;
  const pad = 80, vw = window.innerWidth, vh = window.innerHeight;
  const bw = (maxX - minX) || 200, bh = (maxY - minY) || 200;
  zoom = Math.min(2, Math.max(0.1, (vw - pad*2) / bw, (vh - pad*2) / bh));
  panX = (vw / 2) - ((minX + bw / 2) * zoom);
  panY = (vh / 2) - ((minY + bh / 2) * zoom);
  applyCanvasTransform();
}
function zoomToFit() {
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  nodes.forEach(n => { minX=Math.min(minX, n.x); minY=Math.min(minY, n.y); maxX=Math.max(maxX, n.x+n.w); maxY=Math.max(maxY, n.y+n.h); });
  drawings.forEach(d => { d.points.forEach(p => { minX=Math.min(minX, p.x); minY=Math.min(minY, p.y); maxX=Math.max(maxX, p.x); maxY=Math.max(maxY, p.y); }) });
  zoomToBBox(minX, minY, maxX, maxY);
}
function zoomToSelected() {
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  nodes.filter(n=>selectedIds.has(n.id)).forEach(n => { minX=Math.min(minX, n.x); minY=Math.min(minY, n.y); maxX=Math.max(maxX, n.x+n.w); maxY=Math.max(maxY, n.y+n.h); });
  zoomToBBox(minX, minY, maxX, maxY);
}
document.getElementById('zoom-fit-btn').onclick = zoomToFit;
document.getElementById('zoom-sel-btn').onclick = zoomToSelected;

// ===================== SELECTION & RENDER =====================
function select(id, shiftKey = false) { if (!shiftKey) deselectAll(); selectedIds.add(id); updateSelectionUI(); }
function deselectAll() { selectedIds.clear(); updateSelectionUI(); }
function updateSelectionUI() { canvas.querySelectorAll('.node').forEach(n => n.classList.toggle('selected', selectedIds.has(n.dataset.id))); }

function beginDrag(e, baseId, duplicate) {
  if (duplicate) {
    const originalIds = Array.from(selectedIds); deselectAll();
    originalIds.forEach(id => {
      const orig = nodes.find(n => n.id === id); const clone = JSON.parse(JSON.stringify(orig));
      clone.id = uid(); clone.x += 20; clone.y += 20;
      nodes.push(clone); renderNode(clone); select(clone.id, true);
    });
  }
  const wp = screenToWorld(e.clientX, e.clientY);
  dragState = { items: Array.from(selectedIds).map(id => {
      const n = nodes.find(x => x.id === id); return { node: n, el: canvas.querySelector(`[data-id="${id}"]`), offX: wp.x - n.x, offY: wp.y - n.y };
  })};
}

function renderAll() {
  canvas.querySelectorAll('.node').forEach(n => n.remove());
  nodes.forEach(renderNode);
  drawConnections();
  renderDrawings();
}

function renderNode(node) {
  const el = document.createElement('div');
  el.className = 'node' + (selectedIds.has(node.id) ? ' selected' : '');
  if (node.type === 'comment' && node.collapsed) el.classList.add('comment-collapsed');
  
  el.dataset.id = node.id;
  el.style.width = node.w + 'px'; el.style.height = node.h + 'px';
  el.style.transform = `translate(${node.x}px, ${node.y}px)`;
  if (node.type !== 'image') el.style.background = node.color || 'var(--surface)';

  const header = document.createElement('div'); header.className = 'node-header'; el.appendChild(header);
  const body = document.createElement('div'); body.className = 'node-body';
  body.style.padding = node.type === 'image' ? '0' : '10px';

  if (node.type === 'note' || node.type === 'comment') {
    if(node.type === 'comment') {
      const icon = document.createElement('div'); icon.innerHTML = '💬'; icon.style.display = node.collapsed ? 'block' : 'none';
      el.appendChild(icon);
      el.ondblclick = (e) => { e.stopPropagation(); node.collapsed = false; el.classList.remove('comment-collapsed'); el.style.width=node.w+'px'; el.style.height=node.h+'px'; icon.style.display='none'; }
    }
    const ta = document.createElement('textarea');
    ta.value = node.text || ''; ta.readOnly = true; ta.placeholder = node.type==='comment'?'Add comment...':'Double-click to edit...';
    ta.oninput = e => node.text = e.target.value;
    ta.ondblclick = (e) => { e.stopPropagation(); ta.readOnly = false; ta.focus(); };
    ta.onblur = () => { ta.readOnly = true; if(node.type==='comment' && !node.text) { node.collapsed = true; el.classList.add('comment-collapsed'); el.querySelector('div').style.display='block';} };
    ta.onpointerdown = e => { if(ta.readOnly) e.preventDefault(); else e.stopPropagation(); };
    body.appendChild(ta);
  } else if (node.type === 'shape') {
    if (node.shape === 'circle') el.style.borderRadius = '50%';
    if (node.shape === 'diamond') { el.style.clipPath = 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)'; header.style.display = 'none'; }
    const label = document.createElement('div');
    label.className = 'label'; label.contentEditable = "false"; label.innerText = node.text || '';
    label.oninput = () => node.text = label.innerText;
    label.ondblclick = (e) => { e.stopPropagation(); label.contentEditable = "true"; label.focus(); };
    label.onblur = () => label.contentEditable = "false";
    label.onpointerdown = e => { if(label.contentEditable === "false") e.preventDefault(); else e.stopPropagation(); };
    body.appendChild(label);
  } else if (node.type === 'checklist') {
    const renderItems = () => {
      body.innerHTML = '';
      node.items.forEach((item, i) => {
        const row = document.createElement('div'); row.className = 'checklist-item';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = item.done;
        cb.onchange = () => item.done = cb.checked;
        const txt = document.createElement('span'); txt.innerText = item.text; txt.contentEditable = "false";
        txt.ondblclick = (e) => { e.stopPropagation(); txt.contentEditable = "true"; txt.focus(); };
        txt.onblur = () => { txt.contentEditable = "false"; item.text = txt.innerText; };
        txt.onpointerdown = e => { if(txt.contentEditable==="true") e.stopPropagation(); };
        row.append(cb, txt); body.appendChild(row);
      });
      const addBtn = document.createElement('button'); addBtn.className = 'add-chk-btn'; addBtn.innerText = '+ Add item';
      addBtn.onclick = (e) => { e.stopPropagation(); node.items.push({text:'New item', done:false}); renderItems(); };
      body.appendChild(addBtn);
    };
    renderItems();
  } else if (node.type === 'table') {
    const tbl = document.createElement('table');
    node.rows.forEach((rData, rIdx) => {
      const tr = document.createElement('tr');
      rData.forEach((cText, cIdx) => {
        const td = document.createElement('td'); td.innerText = cText; td.contentEditable = "false";
        td.ondblclick = (e) => { e.stopPropagation(); td.contentEditable = "true"; td.focus(); };
        td.onblur = () => { td.contentEditable = "false"; node.rows[rIdx][cIdx] = td.innerText; };
        td.onpointerdown = e => { if(td.contentEditable==="true") e.stopPropagation(); };
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    body.appendChild(tbl);
  }
  el.appendChild(body);

  const handlePointerDown = (e) => {
    if(toolMode === 'pan') return;
    if(toolMode === 'draw') return;
    if (e.ctrlKey) { e.stopPropagation(); connecting = { fromId: node.id, line: createTempLine(e) }; return; }
    e.stopPropagation();
    if (!selectedIds.has(node.id)) select(node.id, e.shiftKey);
    beginDrag(e, node.id, e.altKey);
  };
  header.addEventListener('pointerdown', handlePointerDown);
  el.addEventListener('pointerdown', (e) => { if(e.target === el || e.target === body || node.collapsed) handlePointerDown(e); });
  if (node.shape === 'diamond') el.addEventListener('pointerdown', handlePointerDown);

  const rh = document.createElement('div'); rh.className = 'resize-handle';
  rh.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); select(node.id, false);
    resizeState = { node, el, startW: node.w, startH: node.h, startWorld: screenToWorld(e.clientX, e.clientY) };
  });
  el.appendChild(rh);

  ['n', 's', 'e', 'w'].forEach(dir => {
    const h = document.createElement('div'); h.className = 'handle ' + dir;
    h.addEventListener('pointerdown', e => { e.stopPropagation(); connecting = { fromId: node.id, line: createTempLine(e) }; });
    el.appendChild(h);
  });

  const tools = document.createElement('div'); tools.className = 'node-tools';
  const del = document.createElement('span'); del.textContent = '✕'; del.onclick = () => deleteSelected(); tools.appendChild(del);
  const colorBtn = document.createElement('span'); colorBtn.textContent = '🎨'; colorBtn.onclick = () => colorRow.classList.toggle('open'); tools.appendChild(colorBtn);
  el.appendChild(tools);

  const colorRow = document.createElement('div'); colorRow.className = 'color-row';
  ['#1e1e1e', '#d4af37', '#e57373', '#64b5f6', '#81c784', '#ffb74d', '#ba68c8'].forEach(c => {
    const sw = document.createElement('div'); sw.className = 'swatch'; sw.style.background = c;
    sw.onclick = () => { selectedIds.forEach(id => { const n = nodes.find(x=>x.id===id); n.color=c; canvas.querySelector(`[data-id="${id}"]`).style.background=c; }); colorRow.classList.remove('open'); };
    colorRow.appendChild(sw);
  });
  el.appendChild(colorRow);
  canvas.appendChild(el);
}

function createTempLine(e) {
  const wp = screenToWorld(e.clientX, e.clientY);
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('class', 'temp-line'); line.setAttribute('x1', wp.x); line.setAttribute('y1', wp.y); line.setAttribute('x2', wp.x); line.setAttribute('y2', wp.y);
  connSvg.appendChild(line); return line;
}

function deleteSelected() {
  nodes = nodes.filter(n => !selectedIds.has(n.id));
  connections = connections.filter(c => !selectedIds.has(c.from) && !selectedIds.has(c.to));
  // Delete drawings if needed (complex, omitting freehand deletion for simplicity)
  deselectAll(); renderAll();
}

// Keyboard
document.addEventListener('keydown', (e) => {
  keysDown[e.key.toLowerCase()] = true;
  if (e.key === 'Escape') { deselectAll(); document.getElementById('settings-panel').classList.remove('open'); setTool('select'); return; }
  if (isTyping()) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedIds.size > 0) return deleteSelected();
  if (e.key.toLowerCase() === 'v') return setTool('select');
  if (e.key.toLowerCase() === 'p') return setTool('draw');
  if (e.key === '!' && e.shiftKey) return zoomToFit(); // Shift+1
  if (e.key === '@' && e.shiftKey) return zoomToSelected(); // Shift+2
});
document.addEventListener('keyup', (e) => keysDown[e.key.toLowerCase()] = false);

// Connections
function drawConnections() {
  connSvg.querySelectorAll('.conn').forEach(l => l.remove());
  connections.forEach(c => {
    const a = nodes.find(n => n.id === c.from), b = nodes.find(n => n.id === c.to);
    if (!a || !b) return;
    const p1 = { x: a.x + a.w/2, y: a.y + a.h/2 }, p2 = { x: b.x + b.w/2, y: b.y + b.h/2 };
    let el;
    if (lineStyle === 'curved') {
      const mx = (p1.x + p2.x)/2, my = (p1.y + p2.y)/2, dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1, bend = Math.min(60, len * 0.25);
      el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      el.setAttribute('d', `M ${p1.x},${p1.y} Q ${mx + (-dy/len)*bend},${my + (dx/len)*bend} ${p2.x},${p2.y}`);
    } else {
      el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      el.setAttribute('x1', p1.x); el.setAttribute('y1', p1.y); el.setAttribute('x2', p2.x); el.setAttribute('y2', p2.y);
    }
    el.setAttribute('class', 'conn'); el.setAttribute('marker-end', 'url(#arrow)');
    connSvg.insertBefore(el, connSvg.firstChild.nextSibling);
  });
}

// Creators
function createNote(pos) { const c = pos || centerWorld(); const n = { id: uid(), type: 'note', x: c.x-100, y: c.y-100, w: 200, h: 200, text: '', color: 'var(--surface)' }; nodes.push(n); renderNode(n); select(n.id); }
function createComment(pos) { const c = pos || centerWorld(); const n = { id: uid(), type: 'comment', x: c.x, y: c.y, w: 240, h: 120, text: '', color: 'var(--highlight)', collapsed: false }; nodes.push(n); renderNode(n); select(n.id); }
function createShape(shape, pos) { const c = pos || centerWorld(); const n = { id: uid(), type: 'shape', shape, x: c.x-80, y: c.y-60, w: 160, h: 120, text: '', color: 'var(--surface)' }; nodes.push(n); renderNode(n); select(n.id); }
function createChecklist(pos) { const c = pos || centerWorld(); const n = { id: uid(), type: 'checklist', x: c.x-120, y: c.y-100, w: 240, h: 200, items: [{text:'Task', done:false}], color: 'var(--surface)' }; nodes.push(n); renderNode(n); select(n.id); }
function createTable(pos) { const c = pos || centerWorld(); const n = { id: uid(), type: 'table', x: c.x-150, y: c.y-100, w: 300, h: 150, rows: [['H1','H2','H3'],['','',''],['','','']], color: 'var(--surface)' }; nodes.push(n); renderNode(n); select(n.id); }

document.getElementById('note-btn').onclick = () => createNote();
document.getElementById('comment-btn').onclick = () => createComment();
document.getElementById('chk-btn').onclick = () => createChecklist();
document.getElementById('tbl-btn').onclick = () => createTable();
const shapeMenu = document.getElementById('shape-menu');
document.getElementById('shape-btn').onclick = (e) => { shapeMenu.style.left = e.target.getBoundingClientRect().left + 'px'; shapeMenu.classList.toggle('open'); };
shapeMenu.querySelectorAll('button').forEach(b => b.onclick = () => { createShape(b.dataset.shape); shapeMenu.classList.remove('open'); });

// Settings / Sync
document.getElementById('settings-btn').onclick = () => document.getElementById('settings-panel').classList.toggle('open');
document.getElementById('theme-row').onclick = (e) => { if (e.target.dataset.v) { theme = e.target.dataset.v; applyTheme(); } };
document.getElementById('bg-row').onclick = (e) => { if (e.target.dataset.v) { bgStyle = e.target.dataset.v; updateBackground(); } };
document.getElementById('line-row').onclick = (e) => { if (e.target.dataset.v) { lineStyle = e.target.dataset.v; updateBackground(); drawConnections(); } };
document.getElementById('snap-toggle').onchange = (e) => snapEnabled = e.target.checked;
document.getElementById('clear-btn').onclick = () => { if (confirm('Clear board?')) { nodes=[]; connections=[]; drawings=[]; deselectAll(); renderAll(); } };

function loadBoardData(data) {
  nodes = data.nodes || []; connections = data.connections || []; drawings = data.drawings || [];
  theme = data.theme || 'dark'; bgStyle = data.bgStyle || 'dots'; lineStyle = data.lineStyle || 'straight'; snapEnabled = !!data.snapEnabled;
  if (typeof data.panX === 'number') panX = data.panX; if (typeof data.panY === 'number') panY = data.panY; if (typeof data.zoom === 'number') zoom = data.zoom;
  document.getElementById('snap-toggle').checked = snapEnabled; applyTheme(); applyCanvasTransform(); renderAll();
}

function gapiLoad() { gapi.load('client', async () => await gapi.client.init({ discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"] })); }
function gisLoad() { tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: (res) => { if (res.error) return; document.getElementById('auth-btn').style.display = 'none'; document.getElementById('save-btn').style.display = 'inline-block'; loadBoard(); } }); }
document.getElementById('auth-btn').onclick = () => tokenClient.requestAccessToken({ prompt: 'consent' });

async function loadBoard() {
  const res = await gapi.client.drive.files.list({ q: `name='${FILE_NAME}' and trashed=false`, spaces: 'drive' });
  if (res.result.files?.length > 0) { fileId = res.result.files[0].id; const fData = await gapi.client.drive.files.get({ fileId, alt: 'media' }); loadBoardData(typeof fData.result === 'string' ? JSON.parse(fData.result) : fData.result); }
}
document.getElementById('save-btn').onclick = async () => {
  const btn = document.getElementById('save-btn'); btn.innerText = 'Syncing...';
  const boundary = 'foo_bar_baz', metadata = { name: FILE_NAME, mimeType: 'application/json' };
  const body = "\r\n--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata) + "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + JSON.stringify({nodes, connections, drawings, theme, bgStyle, lineStyle, snapEnabled, panX, panY, zoom}) + "\r\n--" + boundary + "--";
  await gapi.client.request({ path: fileId ? `/upload/drive/v3/files/${fileId}` : '/upload/drive/v3/files', method: fileId ? 'PATCH' : 'POST', params: { uploadType: 'multipart' }, headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body });
  btn.innerText = 'Synced ✓'; setTimeout(() => btn.innerText = 'Sync', 1500);
};

applyTheme(); applyCanvasTransform();
</script>
